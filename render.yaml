services:
  - type: cron
    name: ticketflip-poller
    runtime: node
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: npx pnpm@11 install --frozen-lockfile --prod
    startCommand: node src/poll.js
    envVars:
      - key: TM_API_KEY
        sync: false
      - key: SEATGEEK_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ticketflip-db
          property: connectionString
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: BANKROLL
        value: "1500"
databases:
  - name: ticketflip-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
